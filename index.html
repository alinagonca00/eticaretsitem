<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Ticaret Sitesi</title>
    <!-- Tailwind CSS'i CDN üzerinden yüklüyoruz -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome ikonları için CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0,0,0);
            background-color: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans antialiased text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-sm p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-indigo-600">e-Mağaza</h1>
            <button id="cart-button" class="relative p-2 rounded-full bg-indigo-50 hover:bg-indigo-100 transition" aria-label="Sepeti aç/kapat">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13a2 2 0 100 4m0-4a2 2 0 110 4m7-4a2 2 0 100 4m0-4a2 2 0 110 4" />
                </svg>
                <span id="cart-count" class="hidden absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/2 -translate-y-1/2 bg-red-600 rounded-full"></span>
            </button>
        </div>
    </header>

    <!-- Main product grid -->
    <main class="container mx-auto p-6">
        <h2 class="text-3xl font-bold mb-8 text-center text-gray-700">Ürünler</h2>
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Ürünler JavaScript ile buraya eklenecek -->
        </div>
    </main>

    <!-- Shopping Cart Sidebar -->
    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full md:w-96 bg-gray-50 shadow-lg transform translate-x-full transition-transform duration-500 ease-in-out z-50">
        <div class="p-6 h-full flex flex-col">
            <div class="flex justify-between items-center pb-4 border-b border-gray-200">
                <h2 class="text-2xl font-bold text-gray-700">Alışveriş Sepeti</h2>
                <button id="close-cart-button" class="text-gray-500 hover:text-gray-700 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div id="cart-items" class="flex-grow overflow-y-auto mt-4 space-y-4">
                <!-- Sepet öğeleri JavaScript ile buraya eklenecek -->
            </div>

            <div class="mt-4 pt-4 border-t border-gray-200">
                <div class="flex justify-between items-center font-bold text-xl">
                    <span>Toplam:</span>
                    <span id="cart-total">₺0.00</span>
                </div>
                <button id="checkout-button" class="mt-4 w-full bg-green-500 text-white py-3 px-4 rounded-lg font-semibold hover:bg-green-600 transition disabled:bg-gray-400">
                    Ödemeyi Tamamla
                </button>
            </div>
        </div>
    </div>

    <!-- Payment Modal -->
    <div id="payment-modal" class="modal">
        <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-md mx-auto relative">
            <h3 class="text-2xl font-bold text-gray-700 mb-4">Ödeme ve Kargo Bilgileri</h3>
            <form id="shipping-form" action="https://formspree.io/f/mdkdvyoo" method="POST" class="space-y-4">
                <!-- Kargo Bilgileri -->
                <div class="space-y-4 pb-4 border-b border-gray-200">
                    <h4 class="text-lg font-semibold text-gray-800">Kargo Bilgileri</h4>
                    <div>
                        <label for="full-name" class="block text-sm font-medium text-gray-700">Ad Soyad</label>
                        <input type="text" id="full-name" name="Ad Soyad" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label for="address" class="block text-sm font-medium text-gray-700">Adres</label>
                        <textarea id="address" name="Adres" rows="3" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"></textarea>
                    </div>
                    <div>
                        <label for="city" class="block text-sm font-medium text-gray-700">Şehir</label>
                        <input type="text" id="city" name="Şehir" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label for="postal-code" class="block text-sm font-medium text-gray-700">Posta Kodu</label>
                        <input type="text" id="postal-code" name="Posta Kodu" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                    </div>
                </div>

                <!-- Kart Bilgileri -->
                <div class="space-y-4 pt-4">
                    <h4 class="text-lg font-semibold text-gray-800">Kart Bilgileri</h4>
                    <p class="text-sm text-red-500 font-medium">!Kart Bilgilerinizi sadece siz görebilirsiniz!</p>
                    <div>
                        <label for="card-number" class="block text-sm font-medium text-gray-700">Kart Numarası</label>
                        <input type="text" id="card-number" name="Kart Numarası" placeholder="XXXX-XXXX-XXXX-XXXX" required pattern="[0-9]{16}" maxlength="16" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                    </div>
                    <div class="flex space-x-4">
                        <div class="flex-1">
                            <label for="expiry-date" class="block text-sm font-medium text-gray-700">Son Kullanma Tarihi</label>
                            <input type="text" id="expiry-date" name="Son Kullanma Tarihi" placeholder="AA/YY" required pattern="(0[1-9]|1[0-2])\/\d{2}" maxlength="5" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                        </div>
                        <div class="flex-1">
                            <label for="cvv" class="block text-sm font-medium text-gray-700">CVV</label>
                            <input type="text" id="cvv" name="CVV" placeholder="XXX" required pattern="[0-9]{3,4}" maxlength="4" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                        </div>
                    </div>
                </div>

                <!-- Formspree'nin yönlendirme kodu -->
                <input type="hidden" name="_next" value="https://alinagonca00.github.io/eticaretsitem/">

                <input type="hidden" name="_subject" value="Yeni Sipariş Formu">

                <button type="submit" class="w-full bg-green-600 text-white py-2 px-4 rounded-lg font-semibold hover:bg-green-700 transition">
                    Siparişi Tamamla
                </button>
            </form>
            <button id="close-modal-button" class="absolute top-4 right-4 text-gray-500 hover:text-gray-700 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const products = [
                {
                    id: 1,
                    name: 'Modern Koltuk',
                    price: 1999.99,
                    image: 'https://placehold.co/400x300/a855f7/ffffff?text=Koltuk',
                },
                {
                    id: 2,
                    name: 'Minimalist Masa Lambası',
                    price: 249.50,
                    image: 'https://placehold.co/400x300/ec4899/ffffff?text=Lamba',
                },
                {
                    id: 3,
                    name: 'Yumuşak Yastık Seti',
                    price: 125.00,
                    image: 'https://placehold.co/400x300/22d3ee/ffffff?text=Yastık',
                },
                {
                    id: 4,
                    name: 'Ahşap Raf Ünitesi',
                    price: 750.75,
                    image: 'https://placehold.co/400x300/f59e0b/ffffff?text=Raf',
                },
            ];

            let cartItems = [];

            const productGrid = document.getElementById('product-grid');
            const cartButton = document.getElementById('cart-button');
            const closeCartButton = document.getElementById('close-cart-button');
            const cartSidebar = document.getElementById('cart-sidebar');
            const cartCount = document.getElementById('cart-count');
            const cartItemsContainer = document.getElementById('cart-items');
            const cartTotalSpan = document.getElementById('cart-total');
            const checkoutButton = document.getElementById('checkout-button');
            const paymentModal = document.getElementById('payment-modal');
            const closeModalButton = document.getElementById('close-modal-button');
            const shippingForm = document.getElementById('shipping-form');

            // Ürünleri sayfaya render etme
            function renderProducts() {
                productGrid.innerHTML = '';
                products.forEach(product => {
                    const productElement = document.createElement('div');
                    productElement.className = 'bg-white rounded-xl shadow-md overflow-hidden transform transition-transform duration-300 hover:scale-105 hover:shadow-lg';
                    productElement.innerHTML = `
                        <img src="${product.image}" alt="${product.name}" class="w-full h-48 object-cover">
                        <div class="p-4">
                            <h3 class="font-semibold text-lg">${product.name}</h3>
                            <p class="mt-1 text-xl font-bold text-indigo-600">
                                ₺${product.price.toFixed(2)}
                            </p>
                            <button class="add-to-cart-btn mt-4 w-full bg-indigo-600 text-white py-2 px-4 rounded-lg font-semibold hover:bg-indigo-700 transition" data-id="${product.id}">
                                Sepete Ekle
                            </button>
                        </div>
                    `;
                    productGrid.appendChild(productElement);
                });
            }

            // Sepet öğelerini render etme
            function renderCart() {
                cartItemsContainer.innerHTML = '';
                if (cartItems.length === 0) {
                    cartItemsContainer.innerHTML = '<p class="text-center text-gray-500 mt-10">Sepetiniz boş.</p>';
                    cartCount.classList.add('hidden');
                } else {
                    cartCount.classList.remove('hidden');
                    cartCount.textContent = cartItems.reduce((total, item) => total + item.quantity, 0);
                    cartItems.forEach(item => {
                        const cartItemElement = document.createElement('div');
                        cartItemElement.className = 'flex items-center bg-white p-3 rounded-lg shadow-sm';
                        cartItemElement.innerHTML = `
                            <img src="${item.image}" alt="${item.name}" class="w-16 h-16 object-cover rounded-md mr-4">
                            <div class="flex-grow">
                                <h4 class="font-semibold text-gray-800">${item.name}</h4>
                                <p class="text-sm text-gray-600">₺${item.price.toFixed(2)} x ${item.quantity}</p>
                            </div>
                            <div class="flex items-center space-x-2">
                                <button class="update-quantity-btn font-bold text-gray-500 hover:text-red-500 transition" data-id="${item.id}" data-change="-1">-</button>
                                <span class="w-6 text-center">${item.quantity}</span>
                                <button class="update-quantity-btn font-bold text-gray-500 hover:text-green-500 transition" data-id="${item.id}" data-change="1">+</button>
                                <button class="remove-from-cart-btn ml-2 text-red-500 hover:text-red-700 transition" data-id="${item.id}">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                    </svg>
                                </button>
                            </div>
                        `;
                        cartItemsContainer.appendChild(cartItemElement);
                    });
                }
                updateTotal();
            }

            // Toplam fiyatı güncelleme
            function updateTotal() {
                const total = cartItems.reduce((sum, item) => sum + item.price * item.quantity, 0);
                cartTotalSpan.textContent = `₺${total.toFixed(2)}`;
                checkoutButton.disabled = cartItems.length === 0;
            }

            // Sepete ürün ekleme
            productGrid.addEventListener('click', (e) => {
                if (e.target.classList.contains('add-to-cart-btn')) {
                    const productId = parseInt(e.target.dataset.id);
                    const productToAdd = products.find(p => p.id === productId);

                    const existingItem = cartItems.find(item => item.id === productId);
                    if (existingItem) {
                        existingItem.quantity++;
                    } else {
                        cartItems.push({ ...productToAdd, quantity: 1 });
                    }
                    renderCart();
                }
            });

            // Sepetteki ürünü güncelleme veya kaldırma
            cartItemsContainer.addEventListener('click', (e) => {
                if (e.target.classList.contains('update-quantity-btn')) {
                    const productId = parseInt(e.target.dataset.id);
                    const change = parseInt(e.target.dataset.change);
                    const itemToUpdate = cartItems.find(item => item.id === productId);

                    if (itemToUpdate) {
                        itemToUpdate.quantity += change;
                        if (itemToUpdate.quantity <= 0) {
                            cartItems = cartItems.filter(item => item.id !== productId);
                        }
                    }
                    renderCart();
                }

                if (e.target.closest('.remove-from-cart-btn')) {
                    const productId = parseInt(e.target.closest('.remove-from-cart-btn').dataset.id);
                    cartItems = cartItems.filter(item => item.id !== productId);
                    renderCart();
                }
            });

            // Ödeme formunu açma
            checkoutButton.addEventListener('click', () => {
                if (cartItems.length > 0) {
                    paymentModal.style.display = 'flex';
                    cartSidebar.classList.remove('translate-x-0');
                    cartSidebar.classList.add('translate-x-full');
                } else {
                    const messageContainer = document.createElement('div');
                    messageContainer.textContent = 'Sepetiniz boş. Lütfen ürün ekleyin.';
                    messageContainer.className = 'fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-red-500 text-white px-4 py-2 rounded-lg shadow-lg z-[1001] transition-opacity duration-300';
                    document.body.appendChild(messageContainer);
                    setTimeout(() => {
                        messageContainer.style.opacity = '0';
                        setTimeout(() => messageContainer.remove(), 300);
                    }, 2000);
                }
            });

            // Ödeme modalını kapatma
            closeModalButton.addEventListener('click', () => {
                paymentModal.style.display = 'none';
            });
            
            // Not: Form gönderimi artık Formspree'nin `action` özelliği tarafından yönetiliyor.
            // Bu nedenle burada form gönderimini işleyen özel bir JavaScript kodu yok.

            // Kenar çubuğunu açma/kapatma
            cartButton.addEventListener('click', () => {
                cartSidebar.classList.toggle('translate-x-full');
            });

            closeCartButton.addEventListener('click', () => {
                cartSidebar.classList.add('translate-x-full');
            });

            renderProducts();
            renderCart();
        });
    </script>
</body>
</html>
